  text:

Всегда смотри шире: в данных профиля есть ещё много аспектов и слоёв, которые прямо связаны или влияют на текущий вопрос — можешь предложить явно: «Кстати, есть ещё один момент в карте который напрямую на это влияет — хочешь разберём?» Важно, чтобы эта инфа была свежей, а не пересказом чего-то из разговора выше. Вопросы-хвостики всегда меняй.

`ПРИОРИТЕТЫ ИНТЕРПРЕТАЦИИ

Ты — астролог AstroBot. Источник истины — только расчётные данные из профиля (натал, транзиты, прогрессии, соляр, синастрия и т.д.), не догадки и не «общие знания» о карте.

  text:
`ПРОГНОЗЫ И БИНАРНЫЕ ВОПРОСЫ

Ты НЕ предсказываешь конкретное событие как факт. Ты анализируешь активированные линии вероятности: главный вектор периода и спектр форм его проявления.

Бинарные вопросы (не отвечай «да/нет» как гарантию): меня уволят? мы расстанемся? будут деньги? он вернётся? получится ли переезд? меня возьмут на работу? будет ли развод? случится ли конкретное событие? стоит ли ждать конкретного решения?

Строгий порядок ответа:

1. Астрологический слой (без контекста жизни)
Сначала только карта: транзиты, прогрессии, соляр, солярная дуга, дома, аспекты, активированные темы. НЕ используй жизненный контекст пользователя на этом этапе.
Определи: главный вектор периода; характер энергии; тип изменений.
Примеры векторов: перестройка работы; нестабильность дохода; смена статуса; разрыв старой системы; новый цикл; расширение; сжатие; возвращение прошлого; кризис идентичности; переход в более самостоятельный формат; усиление ответственности; завершение старого этапа.

2. Спектр сценариев (только из карты)
После вектора — 2–4 формы проявления, рождённые только из карты. Обязательно ранжируй: что главное / наиболее вероятно по опоре в данных; что вторично; что возможно, но слабее; что не является главным вектором. Не перечисляй сценарии как равные. Ранжирование — не гарантия: пиши «сильнее всего карта поддерживает…», «вторым сценарием выглядит…», «слабее поддержан…», а не «точно будет X».

3. Контекстный слой (только после карты)
Подключай контекст: текущие события, конфликты, работа, отношения, процессы, память.
КРИТИЧЕСКОЕ ПРАВИЛО: контекст НЕ создаёт новый сценарий. Он только повышает, понижает или ранжирует сценарии, уже выведенные из карты.
Плохо: «конфликт с начальником → значит карта точно про увольнение».
Хорошо: «карта показывает резкую перестройку работы и дохода; с учётом уже существующего напряжения на работе сценарий увольнения или выхода из старого формата выглядит выше среднего».

4. Вектор vs форма события
Главный вектор карта видит лучше. Конкретную бытовую форму («уволят в пятницу», «разведётесь в июне») — хуже. Не делай вид, что карта идеально видит бытовую форму.

5. Запрещённые категоричные конструкции
Не используй: «этого не будет»; «увольнения не видно»; «вас точно не уволят»; «карта не про потерю»; «этот сценарий невозможен»; «точно произойдёт»; «точно не произойдёт»; «гарантированно»; «однозначно да/нет».
Вместо этого: «тема увольнения не выглядит главным вектором периода»; «карта сильнее акцентирует перестройку, чем разрушение»; «главный вектор сейчас — изменение формата работы»; «этот сценарий возможен, но не выглядит главным»; «с учётом контекста этот сценарий выше среднего».

6. Анти-ретрофит (после события)
Не объясняй задним числом: «это и было видно», «это была классика увольнения», «карта это показывала однозначно».
Если прогноз оказался неточным — честно: какие сигналы переоценены/недооценены; почему карта давала неоднозначность; какой вектор был виден; какую бытовую форму ты прочитал слишком узко.

7. Итоговая цель
AstroBot — навигация по вероятностям жизни, не магический оракул: конкретика через главный вектор; спектр сценариев; ранжирование по карте и контексту; без ложных гарантий; без подгонки карты под уже случившееся.`,

function buildPrompt(blocks, opts = {}) {
  const today = new Date().toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  let parts = [];
  for (const b of blocks) {
    if (b.isDynamic) continue;
    let text = b.text;
    if (b.id === 'identity') text = text.replace('[текущая дата заменяется автоматически]', today);
    parts.push(text);
  }
  let prompt = parts.join('\n\n');

  if (opts.synastry) prompt += '\n\n' + TEST_STUBS.synastryMode;
  if (opts.profile !== false) prompt += '\n' + TEST_STUBS.userProfile;
  if (opts.contact) prompt += '\n' + TEST_STUBS.contactProfile;
  if (opts.memories !== false) prompt += '\n' + TEST_STUBS.memories;

  return prompt;
}

async function callAnthropicAPI(apiKey, systemPrompt, userMessage, model, onChunk) {
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'content-type': 'application/json',
    },
    body: JSON.stringify({
      model: model || 'claude-sonnet-4-5',
      max_tokens: 2048,
      stream: true,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMessage }],
    }),
  });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`API Error ${resp.status}: ${err}`);
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop() || '';
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') continue;
      try {
        const p = JSON.parse(data);
        if (p.type === 'content_block_delta' && p.delta?.type === 'text_delta') {
          onChunk(p.delta.text);
        }
      } catch { /* skip malformed */ }
    }
  }
}

function computeDiff(originalBlocks, currentBlocks) {
  const changes = [];
  for (const cur of currentBlocks) {
    if (cur.isDynamic) continue;
    const orig = originalBlocks.find(b => b.id === cur.id);
    if (!orig || orig.text === cur.text) continue;
    const oLines = orig.text.split('\n');
    const cLines = cur.text.split('\n');
    changes.push({ block: cur, oLines, cLines });
  }
  return changes;
}

function simpleDiff(oLines, cLines) {
  // LCS-based simple diff
  const result = [];
  let oi = 0, ci = 0;
  while (oi < oLines.length || ci < cLines.length) {
    if (oi >= oLines.length) { result.push({ type:'add', line: cLines[ci++] }); continue; }
    if (ci >= cLines.length) { result.push({ type:'del', line: oLines[oi++] }); continue; }
    if (oLines[oi] === cLines[ci]) { result.push({ type:'same', line: oLines[oi++] }); ci++; continue; }
    // Check ahead for moves
    const futureO = oLines.indexOf(cLines[ci], oi + 1);
    const futureC = cLines.indexOf(oLines[oi], ci + 1);
    if (futureO !== -1 && (futureC === -1 || futureO - oi <= futureC - ci)) {
      result.push({ type:'del', line: oLines[oi++] });
    } else {
      result.push({ type:'add', line: cLines[ci++] });
    }
  }
  return result;
}

function BlockCard({ block, selected, highlighted, modified, onSelect }) {

function LeftPanel({ blocks, selectedId, highlightedIds, modifiedIds, onSelect }) {
  const grouped = useMemo(() => {
    const g = {};
    for (const b of blocks) {
      if (!g[b.category]) g[b.category] = [];
      g[b.category].push(b);
    }
    return g;
  }, [blocks]);

  return (
    <div style={{
      width:280, flexShrink:0, background:'#161b22',
      borderRight:'1px solid #21262d', overflowY:'auto', display:'flex', flexDirection:'column'
    }}>
      <div style={{padding:'10px 12px 6px', fontSize:11, fontWeight:700, color:'#8b949e', letterSpacing:.5, borderBottom:'1px solid #21262d'}}>
        БЛОКИ ПРОМПТА · {blocks.length}
      </div>
      {Object.keys(CATEGORIES).map(cat => {
        const bs = grouped[cat];
        if (!bs?.length) return null;
        return (
          <div key={cat}>
            <CategoryHeader cat={cat} />
            {bs.map(b => (
              <BlockCard
                key={b.id}
                block={b}
                selected={selectedId === b.id}
                highlighted={highlightedIds.has(b.id)}
                modified={modifiedIds.has(b.id)}
                onSelect={onSelect}
              />
            ))}
          </div>
        );
      })}
      <div style={{height:20}} />
    </div>
  );
}

function ConnectionGraph({ block, allBlocks, onNavigate }) {
  const dependsOnBlocks = allBlocks.filter(b => block.dependsOn.includes(b.id));
  const dependentsBlocks = allBlocks.filter(b => !b.isDynamic && b.dependsOn.includes(block.id));

  if (!dependsOnBlocks.length && !dependentsBlocks.length) {
    return <div style={{color:'#484f58',fontSize:12,padding:'8px 0'}}>Нет зависимостей</div>;
  }

  const Chip = ({ b, arrow }) => {
    const cat = CATEGORIES[b.category];
    return (
      <button
        onClick={() => onNavigate(b.id)}
        style={{
          display:'inline-flex',alignItems:'center',gap:4,
          padding:'3px 10px',borderRadius:12,fontSize:12,
          background:`${cat.color}18`,color:cat.color,
          border:`1px solid ${cat.color}40`,cursor:'pointer',
          transition:'all .15s',
        }}
        onMouseEnter={e => e.currentTarget.style.background = `${cat.color}30`}
        onMouseLeave={e => e.currentTarget.style.background = `${cat.color}18`}
      >
        {arrow} {b.name}
      </button>
    );
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      {dependsOnBlocks.length > 0 && (
        <div>
          <div style={{fontSize:11,color:'#8b949e',marginBottom:5,fontWeight:600,letterSpacing:.3}}>ЗАВИСИТ ОТ</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
            {dependsOnBlocks.map(b => <Chip key={b.id} b={b} arrow="←" />)}
          </div>
        </div>
      )}
      {dependentsBlocks.length > 0 && (
        <div>
          <div style={{fontSize:11,color:'#8b949e',marginBottom:5,fontWeight:600,letterSpacing:.3}}>ВЛИЯЕТ НА</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
            {dependentsBlocks.map(b => <Chip key={b.id} b={b} arrow="→" />)}
          </div>
        </div>
      )}
    </div>
  );
}

function BottomPanel({ blocks, highlightedIds, setHighlightedIds, apiKey }) {
  const [question, setQuestion] = useState('');
  const [category, setCategory] = useState('general');
  const [model, setModel] = useState('claude-sonnet-4-5');
  const [response, setResponse] = useState('');
  const [origResponse, setOrigResponse] = useState('');
  const [loading, setLoading] = useState(false);
  const [comparing, setComparing] = useState(false);
  const [compareMode, setCompareMode] = useState(false);
  const [error, setError] = useState('');
  const [opts, setOpts] = useState({ profile: true, memories: true, synastry: false, contact: false });

  const origBlocks = useRef(INITIAL_BLOCKS);

  const toggleOpt = k => setOpts(o => ({ ...o, [k]: !o[k] }));

  async function runTest(useOriginal = false) {
    if (!apiKey) { setError('Введите API ключ в шапке'); return; }
    if (!question.trim()) { setError('Введите вопрос'); return; }
    setError('');
    const blocksToUse = useOriginal ? origBlocks.current : blocks;
    const prompt = buildPrompt(blocksToUse, opts);
    let result = '';
    const setter = useOriginal
      ? (chunk) => { result += chunk; setOrigResponse(r => r + chunk); }
      : (chunk) => { result += chunk; setResponse(r => r + chunk); };
    if (!useOriginal) setResponse(''); else setOrigResponse('');
    try {
      await callAnthropicAPI(apiKey, prompt, question, model, setter);
    } catch (e) {
      setError(e.message);
    }
    // Highlight relevant blocks
    const activated = new Set(CATEGORY_ACTIVATES[category] || []);
    setHighlightedIds(activated);
  }

  async function handleTest() {
    setLoading(true);
    setCompareMode(false);
    await runTest(false);
    setLoading(false);
  }

  async function handleCompare() {
    setLoading(true);
    setComparing(true);
    setCompareMode(true);
    setResponse('');
    setOrigResponse('');
    await Promise.all([runTest(false), runTest(true)]);
    setLoading(false);
    setComparing(false);
  }

  const hasChanges = blocks.some((b, i) => !b.isDynamic && b.text !== INITIAL_BLOCKS[i]?.text);

  return (
    <div style={{
      borderTop:'1px solid #21262d', background:'#161b22',
      display:'flex', flexDirection:'column', height:'100%', overflow:'hidden',
    }}>
      {/* Toolbar */}
      <div style={{
        padding:'8px 12px', borderBottom:'1px solid #21262d',
        display:'flex', gap:8, alignItems:'center', flexWrap:'wrap',
      }}>
        <span style={{fontSize:11,fontWeight:700,color:'#8b949e',letterSpacing:.3}}>ТЕСТИРОВАНИЕ</span>
        <select value={category} onChange={e => setCategory(e.target.value)} style={{fontSize:12,padding:'4px 8px'}}>
          {QUESTION_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
        </select>
        <select value={model} onChange={e => setModel(e.target.value)} style={{fontSize:12,padding:'4px 8px'}}>
          <option value="claude-sonnet-4-5">claude-sonnet-4-5</option>
          <option value="claude-haiku-4-5">claude-haiku-4-5</option>
          <option value="claude-opus-4-7">claude-opus-4-7</option>
        </select>
        <span style={{fontSize:11,color:'#484f58',marginLeft:4}}>Данные:</span>
        {[['profile','👤 Профиль'],['memories','🧠 Память'],['synastry','💫 Синастрия'],['contact','👥 Контакт']].map(([k,l]) => (
          <button
            key={k}
            onClick={() => toggleOpt(k)}
            style={{
              fontSize:11,padding:'3px 8px',borderRadius:10,
              background: opts[k] ? 'rgba(88,166,255,.15)' : '#21262d',
              color: opts[k] ? '#58a6ff' : '#484f58',
              border: opts[k] ? '1px solid rgba(88,166,255,.3)' : '1px solid #30363d',
            }}
          >{l}</button>
        ))}
        <div style={{marginLeft:'auto',display:'flex',gap:6}}>
          <button className="btn-secondary" onClick={handleTest} disabled={loading} style={{fontSize:12}}>
            {loading && !comparing ? '⟳ Загрузка…' : '▶ Проверить'}
          </button>
          <button
            onClick={handleCompare} disabled={loading || !hasChanges}
            style={{
              fontSize:12,padding:'6px 14px',borderRadius:6,
              background: hasChanges ? 'rgba(162,137,251,.15)' : '#21262d',
              color: hasChanges ? '#a78bfa' : '#484f58',
              border: hasChanges ? '1px solid rgba(162,137,251,.3)' : '1px solid #30363d',
              cursor: hasChanges ? 'pointer' : 'not-allowed',
            }}
          >
            {comparing ? '⟳ Сравниваю…' : '⇌ Сравнить'}
          </button>
        </div>
      </div>

      {/* Input + response area */}
      <div style={{flex:1,overflow:'hidden',display:'flex',gap:0}}>
        {/* Left: question input */}
        <div style={{width:220,flexShrink:0,padding:10,borderRight:'1px solid #21262d',display:'flex',flexDirection:'column',gap:6}}>
          <div style={{fontSize:11,fontWeight:700,color:'#8b949e',letterSpacing:.3}}>ВОПРОС</div>
          <textarea
            value={question}
            onChange={e => setQuestion(e.target.value)}
            placeholder="Введите тестовый вопрос…"
            onKeyDown={e => { if (e.ctrlKey && e.key === 'Enter') handleTest(); }}
            style={{flex:1,fontSize:12,resize:'none',minHeight:60}}
          />
          {error && <div style={{fontSize:11,color:'#ff7b72',background:'rgba(255,123,114,.1)',padding:'4px 8px',borderRadius:4}}>{error}</div>}
          <div style={{fontSize:10,color:'#484f58'}}>Ctrl+Enter — запустить</div>
        </div>

        {/* Right: responses */}
        <div style={{flex:1,padding:10,overflow:'auto',display:'flex',gap:10}}>
          {compareMode ? (
            <>
              <ResponseDisplay text={origResponse} label="ОРИГИНАЛЬНЫЙ ПРОМПТ" />
              <ResponseDisplay text={response} label="ИЗМЕНЁННЫЙ ПРОМПТ" highlightedIds={highlightedIds} blocks={blocks} />
            </>
          ) : (
            <ResponseDisplay text={response} highlightedIds={highlightedIds} blocks={blocks} />
          )}
        </div>
      </div>
    </div>
  );
}

function ExportModal({ blocks, onClose }) {
  const diffs = computeDiff(INITIAL_BLOCKS, blocks);
  const [copied, setCopied] = useState(false);

  const exportText = diffs.map(d => {
    const diff = simpleDiff(d.oLines, d.cLines);
    const lines = diff.map(l => {
      if (l.type === 'add') return `+ ${l.line}`;
      if (l.type === 'del') return `- ${l.line}`;
      return `  ${l.line}`;
    }).join('\n');
    return `=== ${d.block.name} ===\n${lines}`;
  }).join('\n\n');

  function copy() {
    navigator.clipboard.writeText(exportText);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  }

  return (
    <div style={{
      position:'fixed',inset:0,background:'rgba(0,0,0,.7)',
      display:'flex',alignItems:'center',justifyContent:'center',zIndex:100,
    }} onClick={onClose}>
      <div
        style={{
          background:'#161b22',border:'1px solid #30363d',borderRadius:8,
          width:'min(700px,90vw)',maxHeight:'80vh',display:'flex',flexDirection:'column',
          boxShadow:'0 8px 32px rgba(0,0,0,.4)',
        }}
        onClick={e => e.stopPropagation()}
      >
        <div style={{padding:'12px 16px',borderBottom:'1px solid #30363d',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontWeight:700,fontSize:14}}>Экспорт изменений</span>
          <div style={{display:'flex',gap:8}}>
            <button className="btn-secondary" onClick={copy} style={{fontSize:12}}>
              {copied ? '✓ Скопировано' : '📋 Копировать'}
            </button>
            <button className="btn-ghost" onClick={onClose} style={{padding:'4px 8px',fontSize:16}}>×</button>
          </div>
        </div>
        <div style={{flex:1,overflow:'auto',padding:16}}>
          {diffs.length === 0 ? (
            <div style={{color:'#8b949e',textAlign:'center',padding:24}}>Нет изменений</div>
          ) : (
            diffs.map(d => {
              const diff = simpleDiff(d.oLines, d.cLines);
              return (
                <div key={d.block.id} style={{marginBottom:20}}>
                  <div style={{
                    fontSize:12,fontWeight:700,color:'#c9d1d9',
                    marginBottom:6,padding:'4px 8px',
                    background:'#21262d',borderRadius:4,display:'inline-block'
                  }}>
                    {d.block.name}
                  </div>
                  <pre style={{
                    fontSize:11.5,lineHeight:1.6,fontFamily:"'SF Mono','Fira Code',monospace",
                    background:'#0d1117',border:'1px solid #21262d',
                    borderRadius:6,padding:10,overflow:'auto',
                  }}>
                    {diff.map((l, i) => (
                      <div key={i} style={{
                        color: l.type==='add' ? '#3fb950' : l.type==='del' ? '#ff7b72' : '#8b949e',
                        background: l.type==='add' ? '#0d2a0f' : l.type==='del' ? '#3b1219' : 'transparent',
                        padding:'0 4px',
                      }}>
                        {l.type==='add' ? '+ ' : l.type==='del' ? '- ' : '  '}
                        {l.line}
                      </div>
                    ))}
                  </pre>
                </div>
              );
            })
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [blocks, setBlocks] = useState(() => {
    try {
      const saved = localStorage.getItem('astrobot-blocks');
      if (saved) {
        const parsed = JSON.parse(saved);
        return INITIAL_BLOCKS.map(b => {
          const s = parsed.find(p => p.id === b.id);
          return s ? { ...b, text: s.text } : b;
        });
      }
    } catch { /* ignore */ }
    return INITIAL_BLOCKS;
  });

  const [apiKey, setApiKey] = useState(() => localStorage.getItem('astrobot-apikey') || '');
  const [selectedId, setSelectedId] = useState(null);
  const [highlightedIds, setHighlightedIds] = useState(new Set());
  const [showExport, setShowExport] = useState(false);

  // Track which blocks have been modified
  const modifiedIds = useMemo(() => {
    const s = new Set();
    blocks.forEach((b, i) => {
      if (b.text !== INITIAL_BLOCKS[i]?.text) s.add(b.id);
    });
    return s;
  }, [blocks]);

  // When editing a block, highlight its dependents
  function handleTextChange(id, text) {
    const newBlocks = blocks.map(b => b.id === id ? { ...b, text } : b);
    setBlocks(newBlocks);
    localStorage.setItem('astrobot-blocks', JSON.stringify(newBlocks.map(b => ({ id: b.id, text: b.text }))));
    // Highlight blocks that depend on this one
    const affected = new Set();
    newBlocks.forEach(b => { if (b.dependsOn.includes(id)) affected.add(b.id); });
    setHighlightedIds(prev => new Set([...prev, ...affected]));
  }

  function handleApiKeyChange(k) {
    setApiKey(k);
    localStorage.setItem('astrobot-apikey', k);
  }

  function handleResetAll() {
    if (!confirm('Сбросить все изменения блоков?')) return;
    setBlocks(INITIAL_BLOCKS);
    localStorage.removeItem('astrobot-blocks');
    setHighlightedIds(new Set());
  }

  const selectedBlock = blocks.find(b => b.id === selectedId) || null;
  const hasChanges = modifiedIds.size > 0;

  return (
    <div style={{height:'100vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Header */}
      <div style={{
        height:48, flexShrink:0,
        background:'#161b22', borderBottom:'1px solid #21262d',
        display:'flex', alignItems:'center', padding:'0 16px', gap:12,
      }}>
        <span style={{fontWeight:800,fontSize:15,color:'#c9d1d9',letterSpacing:-.3}}>
          ✦ АстроБот
        </span>
        <span style={{fontSize:12,color:'#8b949e',borderLeft:'1px solid #30363d',paddingLeft:12}}>
          Карта промпта
        </span>
        <div style={{flex:1}} />
        {hasChanges && (
          <button
            className="btn-ghost"
            onClick={() => setShowExport(true)}
            style={{fontSize:12,color:'#f0883e',border:'1px solid rgba(240,136,62,.3)',padding:'4px 10px'}}
          >
            ⤓ Экспорт ({modifiedIds.size})
          </button>
        )}
        {hasChanges && (
          <button className="btn-ghost" onClick={handleResetAll} style={{fontSize:12,color:'#ff7b72'}}>
            ↺ Сбросить всё
          </button>
        )}
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:11,color:'#8b949e'}}>API Key</span>
          <input
            type="password"
            value={apiKey}
            onChange={e => handleApiKeyChange(e.target.value)}
            placeholder="sk-ant-…"
            style={{width:180,fontSize:12}}
          />
        </div>
      </div>

      {/* Main area */}
      <div style={{flex:1, display:'flex', overflow:'hidden', minHeight:0}}>
        {/* Top 2/3: left + right */}
        <div style={{display:'flex', width:'100%', height:'100%', flexDirection:'column'}}>
          <div style={{display:'flex', flex:'0 0 62%', overflow:'hidden', minHeight:0}}>
            <LeftPanel
              blocks={blocks}
              selectedId={selectedId}
              highlightedIds={highlightedIds}
              modifiedIds={modifiedIds}
              onSelect={id => { setSelectedId(id); setHighlightedIds(new Set()); }}
            />
            <RightPanel
              selectedBlock={selectedBlock}
              blocks={blocks}
              originalBlocks={INITIAL_BLOCKS}
              onTextChange={handleTextChange}
              onNavigate={id => setSelectedId(id)}
              highlightedIds={highlightedIds}
            />
          </div>
          {/* Bottom 1/3: testing */}
          <div style={{flex:'0 0 38%', borderTop:'1px solid #21262d', overflow:'hidden', minHeight:0}}>
            <BottomPanel
              blocks={blocks}
              highlightedIds={highlightedIds}
              setHighlightedIds={setHighlightedIds}
              apiKey={apiKey}
            />
          </div>
        </div>
      </div>

      {showExport && <ExportModal blocks={blocks} onClose={() => setShowExport(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
