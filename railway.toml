[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile=false && BASE_PATH=/ pnpm --filter @workspace/astrobot run build && pnpm --filter @workspace/api-server run build"

[deploy]
# Явно отключаем pre-deploy (null в railway.json). Пустой omit → Railway подставляет значение из Dashboard.
# no-op перекрывает Dashboard, если null не применился.
preDeployCommand = ["echo pre-deploy disabled; schema via runDbMigrations at API start"]
startCommand = "node artifacts/api-server/dist/index.cjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
