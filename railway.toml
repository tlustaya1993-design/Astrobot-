[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile=false && BASE_PATH=/ pnpm --filter @workspace/astrobot run build && pnpm --filter @workspace/api-server run build"

[deploy]
# Схема: runDbMigrations при старте API (lib/db/src/migrations.ts).
# preDeploy drizzle-kit push убран: на Railway зависает на «Pulling schema from database…» (introspection).
startCommand = "pnpm --filter @workspace/api-server run start"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
