<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget omitted: unsupported / buggy in some Android WebViews -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2D2152" />
    <meta name="description" content="AstroBot — твой личный AI-астролог. Живой диалог, натальная карта, транзиты и персональные советы." />
    <!-- Open Graph / мессенджеры (VK, Telegram, WhatsApp и др.) — og:image подставляется при сборке, см. VITE_PUBLIC_ORIGIN в vite.config -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AstroBot — Твой личный астролог" />
    <meta property="og:description" content="Твой личный астролог в твоём телефоне. Натальная карта, транзиты и ответы звёзд в живом диалоге." />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="AstroBot — спроси звёзды: натальная карта и персональный AI-астролог" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AstroBot — Твой личный астролог" />
    <meta name="twitter:description" content="Твой личный астролог в твоём телефоне. Натальная карта, транзиты и ответы звёзд в живом диалоге." />
    <meta name="twitter:image" content="__OG_IMAGE__" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AstroBot" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>AstroBot — Твой личный астролог</title>
    <!-- Маленькие размеры первыми — вкладка берёт 32/48, иначе 512 сжимается до «точки» -->
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="512x512" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-blocking fonts: avoid stalling first paint on slow Android networks -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    </noscript>
    <style>
      /* Critical paint before JS/CSS chunks — avoids white flash / blank WebView */
      html, body {
        margin: 0;
        min-height: 100%;
        background: #2D2152;
        color: #f5f5f5;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      #boot-fallback {
        display: none;
        box-sizing: border-box;
        min-height: 100vh;
        padding: 24px;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
      }
      #boot-fallback.visible { display: flex; }
      #boot-fallback button {
        margin-top: 8px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: #E8C36A;
        color: #1a1230;
        font-weight: 600;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" role="alert">
      <p style="font-size:18px;font-weight:600;margin:0">AstroBot не загрузился</p>
      <p style="font-size:14px;opacity:.85;margin:0;max-width:320px;line-height:1.45">
        Откройте сайт в Chrome (не из Telegram) или обновите браузер на телефоне.
      </p>
      <button type="button" onclick="location.reload()">Обновить</button>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // If the ES module bundle never mounts React, show a recoverable UI
      // (old Android WebViews / failed chunk download).
      window.setTimeout(function () {
        var root = document.getElementById('root');
        var fallback = document.getElementById('boot-fallback');
        if (!root || !fallback) return;
        if (!root.childElementCount) {
          fallback.className = 'visible';
        }
      }, 12000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const SW_VERSION = 'v15';
            var stored = null;
            try { stored = localStorage.getItem('sw_version'); } catch (e) {}
            if (stored !== SW_VERSION) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
              const keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
              try { localStorage.setItem('sw_version', SW_VERSION); } catch (e) {}
            }
            navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(function () {});
          } catch (e) {}
        });
      }
    </script>
  </body>
</html>
